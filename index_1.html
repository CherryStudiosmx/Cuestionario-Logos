<title>Cherry Studios Logo Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  :root{
    --paper:#FFFAF5;
    --cream:#FFF4EB;
    --ink:#1C1B1B;
    --ink-soft:#5A3A3A;
    --muted:#8F7370;
    --line:rgba(61,13,17,0.14);
    --card:#FFFFFF;
    --maroon:#3D0D11;
    --maroon-2:#54141A;
    --cherry:#7E0F0D;
    --cherry-2:#9E1613;
    --blush:#FFBEC5;
    --btn-bg:var(--blush);
    --btn-bg-hover:var(--on-dark);
    --btn-text:var(--maroon);
    --shadow-sm:0 10px 24px rgba(61,13,17,0.12);
    --shadow-lg:0 18px 40px rgba(61,13,17,0.22);
    --good:#2E7D4F;
    --on-dark:#FFF4EB;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#2C0A0D;
      --cream:#3D0D11;
      --ink:#FFF4EB;
      --ink-soft:#F0D2CC;
      --muted:#C99A94;
      --line:rgba(255,244,235,0.18);
      --card:#54141A;
      --maroon:#230608;
      --maroon-2:#54141A;
      --cherry:#FFBEC5;
      --cherry-2:#FFF4EB;
      --blush:#FFBEC5;
      --btn-bg:var(--blush);
      --btn-bg-hover:var(--on-dark);
      --btn-text:var(--maroon);
      --shadow-sm:0 10px 24px rgba(0,0,0,0.35);
      --shadow-lg:0 18px 40px rgba(0,0,0,0.5);
      --good:#5FBF88;
      --on-dark:#FFF4EB;
    }
  }
  :root[data-theme="dark"]{
    --paper:#2C0A0D;
    --cream:#3D0D11;
    --ink:#FFF4EB;
    --ink-soft:#F0D2CC;
    --muted:#C99A94;
    --line:rgba(255,244,235,0.18);
    --card:#54141A;
    --maroon:#230608;
    --maroon-2:#54141A;
    --cherry:#FFBEC5;
    --cherry-2:#FFF4EB;
    --blush:#FFBEC5;
    --btn-bg:var(--blush);
    --btn-bg-hover:var(--on-dark);
    --btn-text:var(--maroon);
    --shadow-sm:0 10px 24px rgba(0,0,0,0.35);
    --shadow-lg:0 18px 40px rgba(0,0,0,0.5);
    --good:#5FBF88;
    --on-dark:#FFF4EB;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  em.accent{ font-style:italic; font-weight:500; color:var(--cherry); }
  .mono{font-variant-numeric:tabular-nums;}

  #shell{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    background:var(--maroon);
    color:var(--on-dark);
    box-shadow:var(--shadow-sm);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand b{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:.01em;
    color:var(--on-dark);
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    max-width:212px;
    padding-top:14px;
  }
  .progress-track-outer{
    position:relative;
    flex:1;
  }
  .progress-track{
    height:11px;
    border-radius:99px;
    background:rgba(255,244,235,0.32);
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.28);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--cherry-2), var(--blush));
    border-radius:99px;
    transition:width .35s ease;
    box-shadow:0 0 8px rgba(255,190,197,0.55);
  }
  .progress-cherry{
    position:absolute;
    top:0; left:0;
    width:24px; height:24px;
    color:var(--blush);
    transform:translate(-50%,0);
    transition:left .35s ease;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.45));
  }
  .progress-cherry svg{display:block; width:100%; height:100%;}
  .progress-pct{
    font-size:12px;
    font-weight:700;
    color:var(--on-dark);
    opacity:.92;
    min-width:33px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 20px 48px;}

  .screen{display:none; animation:fade .35s ease;}
  .screen.active{display:flex; flex-direction:column; gap:22px;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .eyebrow{
    font-size:11.5px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--cherry);
    font-weight:700;
  }
  p.lead{color:var(--ink-soft); font-size:15.5px; line-height:1.6; margin:0;}
  p.small{color:var(--muted); font-size:13px; line-height:1.5; margin:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px;
    box-shadow:var(--shadow-sm);
  }

  .field{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  .field label{font-size:13.5px; font-weight:600; color:var(--ink);}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    border-radius:999px;
    padding:10px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .chip:hover{border-color:var(--cherry);}
  .chip.sel{
    background:var(--cherry);
    border-color:var(--cherry);
    color:var(--cream);
  }

  textarea, input[type=text]{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:12px 14px;
    font-family:'Work Sans';
    font-size:14.5px;
    resize:vertical;
  }
  textarea:focus, input:focus{outline:2px solid var(--cherry); outline-offset:1px;}
  textarea{min-height:88px;}

  .btnrow{display:flex; gap:10px; margin-top:4px;}
  button.primary{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:999px;
    padding:15px 26px;
    font-family:'Work Sans';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
    flex:1;
    box-shadow:var(--shadow-sm);
  }
  button.primary:hover{background:var(--btn-bg-hover); transform:translateY(-1px);}
  button.primary:disabled{background:var(--line); color:var(--muted); cursor:not-allowed; box-shadow:none; transform:none;}
  button.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:15px 20px;
    font-family:'Work Sans';
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--cherry); color:var(--cherry);}

  /* exposure stage */
  .stage{
    background:var(--card);
    border-radius:22px;
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .stage img{max-width:100%; max-height:100%; object-fit:contain;}
  .stage.blank{background:var(--paper); box-shadow:var(--shadow-sm);}
  .stage .hint{
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }
  .timerbar{
    position:absolute; bottom:0; left:0; height:4px; background:linear-gradient(90deg, var(--cherry-2), var(--blush)); width:100%;
  }
  .stage-tag{
    position:absolute; left:16px; bottom:16px;
    background:rgba(28,27,27,0.72); color:var(--on-dark);
    font-size:11px; letter-spacing:1px; text-transform:uppercase;
    padding:7px 13px; border-radius:999px;
  }
  .stagenote{
    text-align:center; color:var(--muted); font-size:13px;
  }

  /* rating cards */
  .logocard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:var(--shadow-sm);
  }
  .logocard .imgwrap{
    background:var(--paper);
    border-radius:14px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }
  .logocard img{max-width:100%; height:auto; max-height:110px;}
  .letter-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    background:var(--blush);
    color:var(--maroon);
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    margin-right:8px;
  }
  .dim{margin-top:12px;}
  .dim .lbl{
    display:flex; justify-content:space-between;
    font-size:11.5px; color:var(--muted); margin-bottom:6px;
  }
  .scale5{display:flex; gap:6px;}
  .scale5 button{
    flex:1;
    height:38px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-weight:700;
    cursor:pointer;
  }
  .scale5 button.sel{
    background:var(--cherry);
    border-color:var(--cherry);
    color:var(--cream);
  }

  /* ranking */
  .rankgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .rankitem{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:12px;
    cursor:pointer;
    position:relative;
    transition:.15s;
    box-shadow:var(--shadow-sm);
  }
  .rankitem.picked{border-color:var(--cherry); background:var(--blush);}
  .rankitem img{width:100%; height:auto;}
  .rankbadge{
    position:absolute; top:8px; left:8px;
    background:var(--cherry);
    color:var(--cream);
    font-weight:700;
    font-size:12px;
    width:22px; height:22px;
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
  }

  .thanks-emoji{font-size:40px;}

  footer.hint{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    padding:18px 20px 26px;
  }

  ::selection{background:var(--blush); color:var(--maroon);}
</style>

<div id="shell">
  <header class="top">
    <div class="brand"><b>Cherry Studios</b></div>
    <div class="progress-wrap">
      <div class="progress-track-outer">
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-cherry" id="progressCherry" style="left:0%">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M9.5 3 C9.3 6 8.3 8 7 9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M9.5 3 C10.3 5.8 12.8 7 15 7.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="6.3" cy="13" r="5" fill="currentColor"/>
            <circle cx="16" cy="12.2" r="5.4" fill="currentColor"/>
          </svg>
        </div>
      </div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="hint" id="footerHint">Sesión moderada — un participante a la vez</footer>
</div>

};
const LOGO_IDS = ["L2","L6","L5","L1","L4"]; // orden de referencia pedido por Chemita: Logo1=L2, Logo2=L6, Logo3=L5, Logo4=L1, Logo5=L4 (L3 excluido)

function newSession(){
  return {
    exposureOrder: LOGO_IDS.slice(),
    comparisonOrder: LOGO_IDS.slice(),
    perception: {},
    ranking: [],
    topChoiceWhy: "",
    startedAt: Date.now(),
  };
}

let S = newSession();
let step = "intro";
let exposeIdx = 0;
let evalIdx = 0;
let exposeTimer = null;

const STEP_WEIGHT = {
  intro:1, expose:2, eval:2, ranking:1, thanks:0
};
const STEP_ORDER = ["intro","expose","eval","ranking","thanks"];

function progressPct(){
  const total = STEP_ORDER.reduce((a,s)=>a+STEP_WEIGHT[s],0);
  let done = 0;
  for(const s of STEP_ORDER){
    if(s===step) break;
    done += STEP_WEIGHT[s];
  }
  if(step==="expose") done += (exposeIdx/LOGO_IDS.length)*STEP_WEIGHT.expose;
  if(step==="eval") done += (evalIdx/LOGO_IDS.length)*STEP_WEIGHT.eval;
  return Math.min(100, Math.round((done/total)*100));
}

function goto(next){
  clearTimeout(exposeTimer);
  step = next;
  render();
}

/* ---------- screens ---------- */
function screenIntro(){
  return `
    <div class="screen active">
      <div class="eyebrow">Antes de empezar</div>
      <h1 style="font-size:30px;">Prueba rápida de <em class="accent">propuesta visual</em></h1>
      <p class="lead">A continuación verás unas propuestas visuales, responde según tu percepción.</p>
      <p class="small">En cada paso necesitas completar lo que se pide para poder avanzar al siguiente.</p>
      <p class="small">Al continuar, tus respuestas se guardan de forma anónima para este estudio interno de Cherry Studios.</p>
      <div class="btnrow"><button class="primary" id="introNext" onclick="goto('expose')">Comenzar</button></div>
    </div>`;
}

function screenExpose(){
  return `
    <div class="screen active" id="exposeScreen">
      <div class="eyebrow">Logotipo ${exposeIdx+1} de ${LOGO_IDS.length}</div>
      <div class="stage" id="stage">
        <img id="stageImg" src="">
        <div class="stage-tag">5 segundos</div>
        <div class="timerbar" id="timerbar"></div>
      </div>
      <p class="stagenote" id="stageNote">Obsérvalo con atención.</p>
    </div>`;
}

const PERCEPTION_QS = {
  transmite: {
    label: "¿Qué te transmite este logo?",
    opts: ["Creativo","Artístico","Moderno","Serio"],
  },
  area: {
    label: "¿En qué área te imaginas que se desarrolla?",
    opts: ["Agencia de marketing","Restaurante","Tecnología","Producto creativo"],
  },
};

function screenEval(){
  const id = S.comparisonOrder[evalIdx];
  if(!S.perception[id]) S.perception[id] = {transmite:null, area:null, porque:""};
  const p = S.perception[id];
  const chipRow = (field) => `<div class="chip-row">${PERCEPTION_QS[field].opts.map(o=>
    `<div class="chip ${p[field]===o?'sel':''}" data-v="${o}" onclick="pickPerception('${id}','${field}','${o}',this)">${o}</div>`
  ).join("")}</div>`;
  const complete = p.transmite && p.area && p.porque && p.porque.trim().length>0;
  return `
    <div class="screen active">
      <div class="eyebrow">Propuesta ${evalIdx+1} de ${LOGO_IDS.length}</div>
      <div class="card" style="text-align:center; padding:20px;">
        <div style="background:var(--paper); border-radius:14px; padding:18px; display:flex; align-items:center; justify-content:center;">
          <img src="${IMG[id]}" style="max-width:100%; max-height:160px;">
        </div>
      </div>
      <div class="card">
        <div class="field">
          <label>${PERCEPTION_QS.transmite.label}</label>
          ${chipRow("transmite")}
        </div>
        <div class="field">
          <label>${PERCEPTION_QS.area.label}</label>
          ${chipRow("area")}
        </div>
        <div class="field">
          <label>¿Por qué te hizo pensar eso?</label>
          <textarea oninput="S.perception['${id}'].porque=this.value; checkEvalComplete('${id}');" placeholder="Escribe aquí...">${p.porque||""}</textarea>
        </div>
      </div>
      <div class="btnrow"><button class="primary" id="evalNext" ${complete?"":"disabled"} onclick="nextEval()">Continuar</button></div>
    </div>`;
}

function screenRanking(){
  const items = S.comparisonOrder.map((id,i)=>{
    const letter = "ABCDE"[i];
    const rank = S.ranking.indexOf(id);
    return `<div class="rankitem ${rank>=0?'picked':''}" onclick="pickRank('${id}')">
      ${rank>=0?`<div class="rankbadge">${rank+1}</div>`:""}
      <img src="${IMG[id]}">
      <div class="small" style="text-align:center; margin-top:6px; color:var(--muted);">Logo ${letter}</div>
    </div>`;
  }).join("");
  const rankComplete = S.ranking.length>=LOGO_IDS.length;
  const complete = rankComplete && S.topChoiceWhy.trim().length>0;
  return `
    <div class="screen active">
      <div class="eyebrow">Preferencia final</div>
      <h2 style="font-size:23px;">Ordénalos: toca primero tu <em class="accent">favorito</em></h2>
      <p class="small">1 = el que más te gusta, ${LOGO_IDS.length} = el que menos.</p>
      <div class="rankgrid" style="grid-template-columns:repeat(${LOGO_IDS.length===3?3:2},1fr);">${items}</div>
      ${rankComplete ? `
      <div class="card">
        <div class="field">
          <label>¿Qué fue lo que se te hizo más atractivo de tu primera opción, a comparación de las demás?</label>
          <textarea oninput="S.topChoiceWhy=this.value; checkRankingComplete();" placeholder="Escribe aquí...">${S.topChoiceWhy||""}</textarea>
        </div>
      </div>` : `<p class="small" style="text-align:center;">Termina de ordenar los ${LOGO_IDS.length} logos para continuar.</p>`}
      <div class="btnrow">
        <button class="ghost" onclick="S.ranking=[]; S.topChoiceWhy=''; render();">Reiniciar orden</button>
        <button class="primary" id="submitBtn" ${complete?"":"disabled"} onclick="submitResponse()">Enviar respuestas</button>
      </div>
      <p class="small" id="submitStatus"></p>
    </div>`;
}

function screenThanks(){
  return `
    <div class="screen active" style="align-items:center; text-align:center;">
      <div class="thanks-emoji">🍒</div>
      <h1 style="font-size:26px;">¡Gracias por <em class="accent">participar</em>!</h1>
      <p class="lead">Tu respuesta quedó registrada para el estudio de Cherry Studios.</p>
      <div class="btnrow"><button class="primary" onclick="resetForNext()">Siguiente participante</button></div>
    </div>`;
}

/* ---------- interactions ---------- */
function pickPerception(id, field, val, el){
  S.perception[id][field] = val;
  el.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));
  el.classList.add("sel");
  checkEvalComplete(id);
}

function checkEvalComplete(id){
  const btn = document.getElementById("evalNext");
  if(!btn) return;
  const p = S.perception[id];
  btn.disabled = !(p.transmite && p.area && p.porque && p.porque.trim().length>0);
}

function nextEval(){
  evalIdx++;
  if(evalIdx>=LOGO_IDS.length){
    evalIdx = 0;
    goto("ranking");
  }else{
    render();
  }
}

function pickRank(id){
  const idx = S.ranking.indexOf(id);
  if(idx>=0) return;
  if(S.ranking.length>=LOGO_IDS.length) return;
  S.ranking.push(id);
  render();
}

function checkRankingComplete(){
  const btn = document.getElementById("submitBtn");
  if(!btn) return;
  const rankComplete = S.ranking.length>=LOGO_IDS.length;
  btn.disabled = !(rankComplete && S.topChoiceWhy.trim().length>0);
}

const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbzN_rVMkqTQriv7mrCFb0V0GuEreC0Br_IDNBssZXSoMXUavtI_zOgdlZAARzMCjaPPZA/exec";

async function submitResponse(){
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("submitStatus");
  btn.disabled = true;
  status.textContent = "Guardando...";
  const payload = {
    submittedAt: Date.now(),
    exposureOrder: S.exposureOrder,
    comparisonOrder: S.comparisonOrder,
    perception: S.perception,
    ranking: S.ranking,
    topChoiceWhy: S.topChoiceWhy,
  };
  try{
    await fetch(SHEET_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    status.textContent = "";
    goto("thanks");
  }catch(e){
    status.innerHTML = "No se pudo guardar automáticamente (revisa tu conexión a internet). Copia este texto y envíalo aparte:<br><textarea readonly style='margin-top:8px; min-height:110px;'>"+JSON.stringify(payload)+"</textarea>";
    btn.disabled = false;
  }
}

function resetForNext(){
  S = newSession();
  step = "intro";
  exposeIdx = 0;
  evalIdx = 0;
  render();
}

/* ---------- exposure timing ---------- */
function runExpose(){
  const id = S.exposureOrder[exposeIdx];
  const img = document.getElementById("stageImg");
  const stage = document.getElementById("stage");
  const bar = document.getElementById("timerbar");
  const note = document.getElementById("stageNote");
  img.src = IMG[id];
  stage.classList.remove("blank");
  img.style.display = "block";
  bar.style.transition = "none";
  bar.style.width = "100%";
  note.textContent = "Obsérvalo con atención.";
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      bar.style.transition = "width 5s linear";
      bar.style.width = "0%";
    });
  });
  exposeTimer = setTimeout(()=>{
    img.style.display = "none";
    stage.classList.add("blank");
    note.textContent = "…";
    exposeTimer = setTimeout(()=>{
      exposeIdx++;
      if(exposeIdx>=LOGO_IDS.length){
        evalIdx = 0;
        goto("eval");
      }else{
        render();
      }
    }, 900);
  }, 5000);
}

/* ---------- render ---------- */
function render(){
  const main = document.getElementById("main");
  const footer = document.getElementById("footerHint");
  const pct = progressPct();
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressCherry").style.left = pct+"%";
  document.getElementById("progressPct").textContent = pct+"%";
  if(step==="intro"){ main.innerHTML = screenIntro(); footer.textContent = "Sesión moderada — un participante a la vez"; }
  else if(step==="expose"){ main.innerHTML = screenExpose(); footer.textContent = "Exposición cronometrada — 5 segundos"; runExpose(); }
  else if(step==="eval"){ main.innerHTML = screenEval(); footer.textContent = "Percepción por logotipo"; }
  else if(step==="ranking"){ main.innerHTML = screenRanking(); footer.textContent = "Preferencia final"; }
  else if(step==="thanks"){ main.innerHTML = screenThanks(); footer.textContent = "Participante registrado"; }
}

render();
</script>
