<title>Cherry Studios Logo Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  :root{
    --paper:#FFFAF5;
    --cream:#FFF4EB;
    --ink:#1C1B1B;
    --ink-soft:#5A3A3A;
    --muted:#8F7370;
    --line:rgba(61,13,17,0.14);
    --card:#FFFFFF;
    --maroon:#3D0D11;
    --maroon-2:#54141A;
    --cherry:#7E0F0D;
    --cherry-2:#9E1613;
    --blush:#FFBEC5;
    --btn-bg:var(--blush);
    --btn-bg-hover:var(--on-dark);
    --btn-text:var(--maroon);
    --shadow-sm:0 10px 24px rgba(61,13,17,0.12);
    --shadow-lg:0 18px 40px rgba(61,13,17,0.22);
    --good:#2E7D4F;
    --on-dark:#FFF4EB;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#2C0A0D;
      --cream:#3D0D11;
      --ink:#FFF4EB;
      --ink-soft:#F0D2CC;
      --muted:#C99A94;
      --line:rgba(255,244,235,0.18);
      --card:#54141A;
      --maroon:#230608;
      --maroon-2:#54141A;
      --cherry:#FFBEC5;
      --cherry-2:#FFF4EB;
      --blush:#FFBEC5;
      --btn-bg:var(--blush);
      --btn-bg-hover:var(--on-dark);
      --btn-text:var(--maroon);
      --shadow-sm:0 10px 24px rgba(0,0,0,0.35);
      --shadow-lg:0 18px 40px rgba(0,0,0,0.5);
      --good:#5FBF88;
      --on-dark:#FFF4EB;
    }
  }
  :root[data-theme="dark"]{
    --paper:#2C0A0D;
    --cream:#3D0D11;
    --ink:#FFF4EB;
    --ink-soft:#F0D2CC;
    --muted:#C99A94;
    --line:rgba(255,244,235,0.18);
    --card:#54141A;
    --maroon:#230608;
    --maroon-2:#54141A;
    --cherry:#FFBEC5;
    --cherry-2:#FFF4EB;
    --blush:#FFBEC5;
    --btn-bg:var(--blush);
    --btn-bg-hover:var(--on-dark);
    --btn-text:var(--maroon);
    --shadow-sm:0 10px 24px rgba(0,0,0,0.35);
    --shadow-lg:0 18px 40px rgba(0,0,0,0.5);
    --good:#5FBF88;
    --on-dark:#FFF4EB;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  em.accent{ font-style:italic; font-weight:500; color:var(--cherry); }
  .mono{font-variant-numeric:tabular-nums;}

  #shell{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    background:var(--maroon);
    color:var(--on-dark);
    box-shadow:var(--shadow-sm);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand b{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:.01em;
    color:var(--on-dark);
  }
  .progress-wrap{
    position:relative;
    flex:1;
    max-width:150px;
    padding-top:10px;
  }
  .progress-track{
    height:5px;
    border-radius:99px;
    background:rgba(255,244,235,0.22);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--cherry-2), var(--blush));
    border-radius:99px;
    transition:width .35s ease;
  }
  .progress-cherry{
    position:absolute;
    top:0; left:0;
    width:16px; height:16px;
    color:var(--blush);
    transform:translate(-50%,0);
    transition:left .35s ease;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .progress-cherry svg{display:block; width:100%; height:100%;}

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 20px 48px;}

  .screen{display:none; animation:fade .35s ease;}
  .screen.active{display:flex; flex-direction:column; gap:22px;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .eyebrow{
    font-size:11.5px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--cherry);
    font-weight:700;
  }
  p.lead{color:var(--ink-soft); font-size:15.5px; line-height:1.6; margin:0;}
  p.small{color:var(--muted); font-size:13px; line-height:1.5; margin:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px;
    box-shadow:var(--shadow-sm);
  }

  .field{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  .field label{font-size:13.5px; font-weight:600; color:var(--ink);}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    border-radius:999px;
    padding:10px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .chip:hover{border-color:var(--cherry);}
  .chip.sel{
    background:var(--cherry);
    border-color:var(--cherry);
    color:var(--cream);
  }

  textarea, input[type=text]{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:12px 14px;
    font-family:'Work Sans';
    font-size:14.5px;
    resize:vertical;
  }
  textarea:focus, input:focus{outline:2px solid var(--cherry); outline-offset:1px;}
  textarea{min-height:88px;}

  .btnrow{display:flex; gap:10px; margin-top:4px;}
  button.primary{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:999px;
    padding:15px 26px;
    font-family:'Work Sans';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
    flex:1;
    box-shadow:var(--shadow-sm);
  }
  button.primary:hover{background:var(--btn-bg-hover); transform:translateY(-1px);}
  button.primary:disabled{background:var(--line); color:var(--muted); cursor:not-allowed; box-shadow:none; transform:none;}
  button.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:15px 20px;
    font-family:'Work Sans';
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--cherry); color:var(--cherry);}

  /* exposure stage */
  .stage{
    background:var(--card);
    border-radius:22px;
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .stage img{max-width:100%; max-height:100%; object-fit:contain;}
  .stage.blank{background:var(--paper); box-shadow:var(--shadow-sm);}
  .stage .hint{
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }
  .timerbar{
    position:absolute; bottom:0; left:0; height:4px; background:linear-gradient(90deg, var(--cherry-2), var(--blush)); width:100%;
  }
  .stage-tag{
    position:absolute; left:16px; bottom:16px;
    background:rgba(28,27,27,0.72); color:var(--on-dark);
    font-size:11px; letter-spacing:1px; text-transform:uppercase;
    padding:7px 13px; border-radius:999px;
  }
  .stagenote{
    text-align:center; color:var(--muted); font-size:13px;
  }

  /* rating cards */
  .logocard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:var(--shadow-sm);
  }
  .logocard .imgwrap{
    background:var(--paper);
    border-radius:14px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }
  .logocard img{max-width:100%; height:auto; max-height:110px;}
  .letter-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    background:var(--blush);
    color:var(--maroon);
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    margin-right:8px;
  }
  .dim{margin-top:12px;}
  .dim .lbl{
    display:flex; justify-content:space-between;
    font-size:11.5px; color:var(--muted); margin-bottom:6px;
  }
  .scale5{display:flex; gap:6px;}
  .scale5 button{
    flex:1;
    height:38px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-weight:700;
    cursor:pointer;
  }
  .scale5 button.sel{
    background:var(--cherry);
    border-color:var(--cherry);
    color:var(--cream);
  }

  /* ranking */
  .rankgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .rankitem{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:12px;
    cursor:pointer;
    position:relative;
    transition:.15s;
    box-shadow:var(--shadow-sm);
  }
  .rankitem.picked{border-color:var(--cherry); background:var(--blush);}
  .rankitem img{width:100%; height:auto;}
  .rankbadge{
    position:absolute; top:8px; left:8px;
    background:var(--cherry);
    color:var(--cream);
    font-weight:700;
    font-size:12px;
    width:22px; height:22px;
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
  }

  .thanks-emoji{font-size:40px;}

  footer.hint{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    padding:18px 20px 26px;
  }

  ::selection{background:var(--blush); color:var(--maroon);}
</style>

<div id="shell">
  <header class="top">
    <div class="brand"><b>Cherry Studios</b></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-cherry" id="progressCherry" style="left:0%">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9.5 3 C9.3 6 8.3 8 7 9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M9.5 3 C10.3 5.8 12.8 7 15 7.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="6.3" cy="13" r="5" fill="currentColor"/>
          <circle cx="16" cy="12.2" r="5.4" fill="currentColor"/>
        </svg>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="hint" id="footerHint">Sesión moderada — un participante a la vez</footer>
</div>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let exposeTimer = null;

const STEP_WEIGHT = {
  intro:1, expose:2, filler:1, recall:1, reveal:2, ranking:1, closing:1, thanks:0
};
const STEP_ORDER = ["intro","expose","filler","recall","reveal","ranking","closing","thanks"];

function progressPct(){
  const total = STEP_ORDER.reduce((a,s)=>a+STEP_WEIGHT[s],0);
  let done = 0;
  for(const s of STEP_ORDER){
    if(s===step) break;
    done += STEP_WEIGHT[s];
  }
  if(step==="expose") done += (exposeIdx/LOGO_IDS.length)*STEP_WEIGHT.expose;
  return Math.min(100, Math.round((done/total)*100));
}

function goto(next){
  clearTimeout(exposeTimer);
  step = next;
  render();
}

/* ---------- screens ---------- */

      <h1 style="font-size:30px;">Prueba rápida de <em class="accent">logotipos</em></h1>
      <p class="lead">Vas a ver ${LOGO_IDS.length} propuestas de logotipo, una por una, unos segundos cada una. Luego te haré unas preguntas cortas sobre lo que recuerdas y lo que más te gusta. No hay respuestas correctas — solo queremos tu primera impresión honesta.</p>
      <p class="small">En cada paso necesitas completar lo que se pide para poder avanzar al siguiente.</p>
      <div class="card">
        <div class="field">
          <label>Rango de edad</label>
          <div class="chip-row">
            ${["-18","18-24","25-34","35-44","45+"].map(v=>`<div class="chip" data-v="${v}" onclick="pick('ageRange','${v}',this)">${v}</div>`).join("")}
          </div>
        </div>
      </div>
      <p class="small">Al continuar, tus respuestas se guardan de forma anónima para este estudio interno de Cherry Studios.</p>
      <div class="btnrow"><button class="primary" id="introNext" disabled onclick="goto('expose')">Comenzar</button></div>
    </div>`;
}

function screenExpose(){
  return `
    <div class="screen active" id="exposeScreen">
      <div class="eyebrow">Logotipo ${exposeIdx+1} de ${LOGO_IDS.length}</div>
      <div class="stage" id="stage">
        <img id="stageImg" src="">
        <div class="stage-tag">5 segundos</div>
        <div class="timerbar" id="timerbar"></div>
      </div>
      <p class="stagenote" id="stageNote">Obsérvalo con atención.</p>
    </div>`;
}

function screenFiller(){
  return `
    <div class="screen active">
      <div class="eyebrow">Pausa breve</div>
      <h2 style="font-size:23px;">Antes de <em class="accent">seguir</em>…</h2>
      <div class="card" style="text-align:center;">
        <p class="lead">Cuenta mentalmente hacia atrás desde 50, de 3 en 3 (50, 47, 44…), hasta que el botón se active.</p>
        <p class="mono" id="fillerCount" style="font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:var(--cherry); margin-top:14px;">10</p>
      </div>
      <div class="btnrow"><button class="primary" id="fillerNext" disabled onclick="goto('recall')">Continuar</button></div>
    </div>`;
}

function screenRecall(){
  return `
    <div class="screen active">
      <div class="eyebrow">Sin ver de nuevo las imágenes</div>
      <h2 style="font-size:23px;">¿Qué <em class="accent">recuerdas</em>?</h2>
      <div class="card">
        <div class="field">
          <label>Describe todo lo que recuerdes de los logotipos: formas, letras, símbolos, lo que sea</label>
          <textarea id="freeRecall" oninput="S.freeRecall=this.value; checkRecallComplete()" placeholder="Escribe aquí..."></textarea>
        </div>
        <div class="field">
          <label>¿Cuál se te quedó más grabado? Descríbelo con tus palabras</label>
          <input type="text" id="mostMemorable" oninput="S.mostMemorable=this.value; checkRecallComplete()" placeholder="Ej: el que tenía letras redondas...">
        </div>
      </div>
      <div class="btnrow"><button class="primary" id="recallNext" disabled onclick="goto('reveal')">Continuar</button></div>
      <p class="small">Completa los dos campos para continuar.</p>
    </div>`;
}

const DIMS = [
  {k:"liking", lo:"No me gusta", hi:"Me gusta mucho"},
  {k:"pro", lo:"Se ve amateur", hi:"Se ve profesional"},
  {k:"original", lo:"Genérico", hi:"Original"},
  {k:"fit", lo:"No encaja con un estudio", hi:"Encaja perfecto"},
];

function screenReveal(){
  const cards = S.comparisonOrder.map((id, i)=>{
    const letter = "ABCD"[i];
    if(!S.ratings[id]) S.ratings[id] = {};
    const dimsHtml = DIMS.map(d=>{
      const val = S.ratings[id][d.k];
      const btns = [1,2,3,4,5].map(n=>`<button class="${val===n?'sel':''}" onclick="setRating('${id}','${d.k}',${n})">${n}</button>`).join("");
      return `<div class="dim">
        <div class="lbl"><span>${d.lo}</span><span>${d.hi}</span></div>
        <div class="scale5">${btns}</div>
      </div>`;
    }).join("");
    return `<div class="logocard">
      <div class="imgwrap"><img src="${IMG[id]}"></div>
      <div style="display:flex; align-items:center; margin-bottom:2px;"><span class="letter-badge">${letter}</span><span class="small" style="color:var(--muted);">Califica este logotipo</span></div>
      ${dimsHtml}
    </div>`;
  }).join("");

  return `
    <div class="screen active">
      <div class="eyebrow">Ahora sí, compáralos</div>
      <h2 style="font-size:23px;">Califica cada <em class="accent">logotipo</em></h2>
      <p class="small">Toca un número del 1 al 5 en cada línea.</p>
      ${cards}
      <div class="btnrow"><button class="primary" id="revealNext" disabled onclick="goto('ranking')">Continuar</button></div>
    </div>`;
}

function screenRanking(){
  const items = S.comparisonOrder.map((id,i)=>{
    const letter = "ABCD"[i];
    const rank = S.ranking.indexOf(id);
    return `<div class="rankitem ${rank>=0?'picked':''}" onclick="pickRank('${id}')">
      ${rank>=0?`<div class="rankbadge">${rank+1}</div>`:""}
      <img src="${IMG[id]}">
      <div class="small" style="text-align:center; margin-top:6px; color:var(--muted);">Logo ${letter}</div>
    </div>`;
  }).join("");
  return `
    <div class="screen active">
      <div class="eyebrow">Preferencia final</div>
      <h2 style="font-size:23px;">Ordénalos: toca primero tu <em class="accent">favorito</em></h2>
      <p class="small">1 = el que más te gusta, 4 = el que menos.</p>
      <div class="rankgrid" style="grid-template-columns:repeat(${LOGO_IDS.length===3?3:2},1fr);">${items}</div>
      <div class="btnrow">
        <button class="ghost" onclick="S.ranking=[]; render();">Reiniciar orden</button>
        <button class="primary" id="rankNext" ${S.ranking.length<LOGO_IDS.length?"disabled":""} onclick="goto('closing')">Continuar</button>
      </div>
    </div>`;
}

function screenClosing(){
  return `
    <div class="screen active">
      <div class="eyebrow">Última pregunta</div>
      <h2 style="font-size:23px;">¿Cambiarías algo de tu <em class="accent">favorito</em>?</h2>
      <div class="card">
        <div class="field">
          <textarea id="comment" oninput="S.comment=this.value" placeholder="Opcional..."></textarea>
        </div>
      </div>
      <div class="btnrow"><button class="primary" id="submitBtn" onclick="submitResponse()">Enviar respuestas</button></div>
      <p class="small" id="submitStatus"></p>
    </div>`;
}

function screenThanks(){
  return `
    <div class="screen active" style="align-items:center; text-align:center;">
      <div class="thanks-emoji">🍒</div>
      <h1 style="font-size:26px;">¡Gracias por <em class="accent">participar</em>!</h1>
      <p class="lead">Tu respuesta quedó registrada para el estudio de Cherry Studios.</p>
      <div class="btnrow"><button class="primary" onclick="resetForNext()">Siguiente participante</button></div>
    </div>`;
}

/* ---------- interactions ---------- */
function pick(field, val, el){
  S[field]=val;
  el.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));
  el.classList.add("sel");
  const btn = document.getElementById("introNext");
  if(btn) btn.disabled = !S.ageRange;
}

function sync(){}

function checkRecallComplete(){
  const btn = document.getElementById("recallNext");
  if(!btn) return;
  btn.disabled = !(S.freeRecall.trim() && S.mostMemorable.trim());
}

function setRating(id, dim, val){
  S.ratings[id][dim]=val;
  render();
  checkRevealComplete();
}

function checkRevealComplete(){
  const btn = document.getElementById("revealNext");
  if(!btn) return;
  const complete = S.comparisonOrder.every(id => DIMS.every(d => S.ratings[id] && S.ratings[id][d.k]));
  btn.disabled = !complete;
}

function pickRank(id){
  const idx = S.ranking.indexOf(id);
  if(idx>=0) return;
  if(S.ranking.length>=LOGO_IDS.length) return;
  S.ranking.push(id);
  render();
}

const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbzN_rVMkqTQriv7mrCFb0V0GuEreC0Br_IDNBssZXSoMXUavtI_zOgdlZAARzMCjaPPZA/exec";

async function submitResponse(){
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("submitStatus");
  btn.disabled = true;
  status.textContent = "Guardando...";
  const payload = {
    submittedAt: Date.now(),
    ageRange: S.ageRange,
    exposureOrder: S.exposureOrder,
    comparisonOrder: S.comparisonOrder,
    freeRecall: S.freeRecall,
    mostMemorable: S.mostMemorable,
    ratings: S.ratings,
    ranking: S.ranking,
    comment: S.comment,
  };
  try{
    await fetch(SHEET_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    status.textContent = "";
    goto("thanks");
  }catch(e){
    status.innerHTML = "No se pudo guardar automáticamente (revisa tu conexión a internet). Copia este texto y envíalo aparte:<br><textarea readonly style='margin-top:8px; min-height:110px;'>"+JSON.stringify(payload)+"</textarea>";
    btn.disabled = false;
  }
}

function resetForNext(){
  S = newSession();
  step = "intro";
  exposeIdx = 0;
  render();
}

/* ---------- exposure timing ---------- */
function runExpose(){
  const id = S.exposureOrder[exposeIdx];
  const img = document.getElementById("stageImg");
  const stage = document.getElementById("stage");
  const bar = document.getElementById("timerbar");
  const note = document.getElementById("stageNote");
  img.src = IMG[id];
  stage.classList.remove("blank");
  img.style.display = "block";
  bar.style.transition = "none";
  bar.style.width = "100%";
  note.textContent = "Obsérvalo con atención.";
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      bar.style.transition = "width 5s linear";
      bar.style.width = "0%";
    });
  });
  exposeTimer = setTimeout(()=>{
    img.style.display = "none";
    stage.classList.add("blank");
    note.textContent = "…";
    exposeTimer = setTimeout(()=>{
      exposeIdx++;
      if(exposeIdx>=LOGO_IDS.length){
        goto("filler");
      }else{
        render();
      }
    }, 900);
  }, 5000);
}

function runFiller(){
  let n = 10;
  const el = document.getElementById("fillerCount");
  const btn = document.getElementById("fillerNext");
  const t = setInterval(()=>{
    n--;
    if(el) el.textContent = n;
    if(n<=0){
      clearInterval(t);
      if(btn) btn.disabled = false;
      if(el) el.textContent = "✓";
    }
  }, 1000);
}

/* ---------- render ---------- */
function render(){
  const main = document.getElementById("main");
  const footer = document.getElementById("footerHint");
  const pct = progressPct();
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressCherry").style.left = pct+"%";
  if(step==="intro"){ main.innerHTML = screenIntro(); footer.textContent = "Sesión moderada — un participante a la vez"; }
  else if(step==="expose"){ main.innerHTML = screenExpose(); footer.textContent = "Exposición cronometrada — 5 segundos"; runExpose(); }
  else if(step==="filler"){ main.innerHTML = screenFiller(); footer.textContent = "Pausa antes de la prueba de memoria"; runFiller(); }
  else if(step==="recall"){ main.innerHTML = screenRecall(); footer.textContent = "Prueba de recordación libre"; }
  else if(step==="reveal"){ main.innerHTML = screenReveal(); footer.textContent = "Comparación — logotipos sin identificar"; checkRevealComplete(); }
  else if(step==="ranking"){ main.innerHTML = screenRanking(); footer.textContent = "Preferencia final"; }
  else if(step==="closing"){ main.innerHTML = screenClosing(); footer.textContent = "Última pregunta"; }
  else if(step==="thanks"){ main.innerHTML = screenThanks(); footer.textContent = "Participante registrado"; }
}

render();
</script>
